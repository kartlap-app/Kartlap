<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#090e14">
<title>KartLap • Tour de chauffe V4 — Démonstration</title>
<style>
:root{color-scheme:dark;--bg:#090e14;--panel:#101721;--panel2:#192633;--outline:#344456;--ink:#f1f5fa;--muted:#a7b6c5;--teal:#57dbe6;--orange:#ff6a3e;--purple:#c68bff;--good:#a5e69f;--space:clamp(10px,2.6vw,18px)}
*{box-sizing:border-box} html,body{height:100%;min-height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"SF Pro Display",Arial,sans-serif;-webkit-font-smoothing:antialiased} button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,.demo-card:focus-visible{outline:3px solid var(--teal);outline-offset:3px} .app{height:100vh;height:100dvh;padding:calc(env(safe-area-inset-top) + 9px) max(12px,calc((100vw - 470px)/2)) calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;overflow:hidden}
.shell{background:var(--panel);border:1px solid var(--outline);border-radius:24px;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:var(--space);box-shadow:0 18px 80px #0008}
.header{display:flex;justify-content:space-between;align-items:center;min-height:36px;gap:12px} .brand{font-weight:850;letter-spacing:.14em;font-size:11px;color:var(--teal)} .step-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin-top:3px;text-transform:uppercase}.close{width:38px;height:38px;border-radius:13px;background:#202b37;color:#e1e6ed;border:1px solid var(--outline);font-size:24px;line-height:1}
.progress{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:12px 0} .progress span{height:4px;border-radius:3px;background:#3d5062}.progress span.done{background:var(--teal)}.progress span.current{background:var(--orange)}
.intro{display:flex;align-items:flex-start;gap:10px;min-height:0;margin-bottom:10px}.step-sign{display:grid;place-items:center;flex-shrink:0;width:37px;height:37px;border:1px solid #4b5d70;background:#1f2c38;border-radius:11px;font-size:18px;color:#ff9f76;font-weight:750}.intro-copy{min-width:0}.intro h1{font-size:clamp(18px,4.5vw,24px);line-height:1.14;letter-spacing:-.04em;font-weight:850;margin:0 0 5px}.intro p{font-size:clamp(12px,3.1vw,14px);line-height:1.35;margin:0;color:var(--muted);max-width:45ch}
.scene{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;position:relative}.scene-stage{flex:1;min-height:0;position:relative;overflow:hidden;border:1px solid #4e647c;border-radius:18px;background:#0c1219;display:flex;flex-direction:column;padding:12px;isolation:isolate}.demo-tag{color:#91c5c9;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;display:flex;align-items:center;gap:6px}.demo-tag i{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block}.scene-section{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}.mini-heading{font-size:12px;font-weight:750;letter-spacing:.03em;color:#c4d1de}.mini-meta{color:var(--muted);font-size:11px}
.pilot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:9px;flex:1;min-height:0}.pilot{border:1px solid #425569;border-radius:13px;background:#1a2735;padding:11px 9px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden}.pilot.orange{border-color:#ffa27e}.pilot.teal{border-color:#66dce4}.pilot.purple{border-color:var(--purple);box-shadow:inset 0 0 0 1px #c68bff44}.pilot.grey{opacity:.5}.pilot-name{font-weight:850;font-size:clamp(12px,3.7vw,17px);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pilot-tag{font-size:10px;color:var(--muted);margin-top:3px}.pilot-time{font-size:clamp(21px,6.7vw,33px);line-height:1;letter-spacing:-.05em;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}.pilot-summary{font-size:clamp(10px,2.6vw,12px);color:#acc3d1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pilot.purple .pilot-summary{color:var(--purple)}.pilot.stopped{border-color:#ef986e;box-shadow:inset 0 0 0 1px #ef986e44}.pilot.stopped .pilot-summary,.pilot.stopped .pilot-tag{color:#ffad84}
.card-slot{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none}.reveal{pointer-events:none;position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:16px;font-weight:800;font-size:13px}.reveal .go-right{color:var(--teal)}.reveal .go-left{color:#ffa176}.demo-card{position:relative;flex:1;min-height:0;background:#1b2835;border:1.5px solid var(--teal);border-radius:14px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;will-change:transform;transition:transform .2s cubic-bezier(.22,1,.36,1),border-color .15s;overflow:hidden;touch-action:pan-y;cursor:grab}.demo-card:active{cursor:grabbing}.demo-card.dragging{transition:none}.card-main{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.num-name{font-size:clamp(17px,5vw,22px);font-weight:850}.status-pill{font-size:10px;font-weight:800;color:#8cb3bf;letter-spacing:.08em;margin-top:3px}.time-big{font-weight:850;font-variant-numeric:tabular-nums;font-size:clamp(43px,15vw,68px);letter-spacing:-.06em;line-height:.95;white-space:nowrap}.time-big.small{font-size:clamp(36px,11vw,52px)}.last-best{display:flex;justify-content:space-between;gap:6px;border-top:1px solid #354755;padding-top:9px}.last-best>div{font-size:11px;color:#bacbd8}.last-best strong{font-size:clamp(14px,4vw,17px);display:block;color:var(--teal);font-variant-numeric:tabular-nums}.last-best .purple-ink{color:var(--purple)}.lap-count{font-size:11px;color:#9eb8c9}.central{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(11px,3vh,30px)}.lap-peek{border-top:1px solid #354755;padding-top:7px}.lap-peek-title{font-size:10px;color:#a1b5c5;font-weight:750;letter-spacing:.06em;margin-bottom:5px}.lap-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.lap-chip{background:#14212e;border:1px solid #36495b;padding:6px 3px;border-radius:7px;font-size:11px;line-height:1.25;text-align:center;color:#cedce7;font-variant-numeric:tabular-nums;font-weight:850}.lap-chip span{display:block;font-size:9px;font-weight:650;color:#91aabc}.lap-chip.pb{border-color:var(--teal);color:var(--teal)}.highlight{box-shadow:0 0 0 2px #ff6a3e77,0 0 30px #ff6a3e20}.swipe-nudge{position:absolute;top:55px;right:12px;border-radius:9px;padding:5px 8px;font-size:10px;color:#d0f6fa;background:#254151;font-weight:850;letter-spacing:.06em;pointer-events:none}.swipe-nudge.left{right:auto;left:12px;color:#ffd4c4;background:#52352d}.tap-hint{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);padding:8px 13px;border-radius:99px;background:#ff6a3e;color:#120c08;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:0 0 0 6px #ff6a3e25;pointer-events:none}
.lap-sheet{height:100%;display:flex;flex-direction:column;gap:6px}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:6px}.sheet-head b{font-size:18px}.sheet-head span{color:var(--teal);font-size:11px;font-weight:750}.lap-row{border:1px solid #364a5b;border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;background:#192633}.lap-row strong{font-size:clamp(15px,5vw,19px);font-variant-numeric:tabular-nums}.lap-row.pb{border-color:var(--purple)}.lap-row.pb strong,.lap-row.pb .lap-icon{color:var(--purple)}.lap-icon{color:var(--muted)}.sheet-info{font-size:11px;color:var(--muted);margin-top:auto}.sheet-return{padding:8px 10px;text-align:center;border-radius:10px;background:#283748;border:1px solid #476073;color:#e2ecf6;font-size:12px;font-weight:800}
.result-panel{display:flex;flex-direction:column;min-height:0;flex:1;gap:8px}.result-title{font-weight:850;font-size:18px}.result-sub{font-size:12px;color:var(--muted)}.rank-line{display:grid;grid-template-columns:18px 1fr 76px 76px;gap:8px;align-items:center;border:1px solid #344b60;background:#192633;border-radius:10px;padding:10px 8px;font-size:12px}.rank-line strong{font-variant-numeric:tabular-nums;text-align:right;font-size:13px}.rank-line em{font-style:normal;color:var(--muted);text-align:right;font-size:11px}.rank-line.winner{border-color:var(--purple)}.rank-line.winner strong{color:var(--purple)}.summary-foot{margin-top:auto;font-size:11px;color:var(--muted)}
.actionline{flex:0 0 auto;display:grid;gap:6px;padding-top:3px}.action-btn{width:100%;border:1px solid #527083;border-radius:12px;background:#131d27;color:#e3f0f8;padding:9px 11px;min-height:40px;font-size:12px;font-weight:800}.action-btn.primary{border-color:var(--orange);background:#ff6a3e;color:#15100c}.action-btn:hover{filter:brightness(1.07)}.footnote{font-size:11px;line-height:1.3;color:#9eb1c0;min-height:14px}.footnote .ok{color:var(--good)}.footnote .hint{color:#ffc6af}.nav{display:grid;grid-template-columns:1fr 1.45fr;gap:8px;margin-top:9px}.nav button{padding:11px 8px;min-height:43px;border-radius:12px;border:1px solid #45596d;background:#101820;color:#c8d5e3;font-size:14px;font-weight:850}.nav button.next{border-color:var(--orange);background:var(--orange);color:#150b08}.nav button:disabled{opacity:.3;cursor:not-allowed}.privacy{text-align:center;margin:7px 0 0;font-size:10px;color:#8294a6}
.modal-backdrop{position:absolute;inset:0;z-index:8;border-radius:16px;background:#05080cd9;display:grid;place-items:center;padding:16px}.modal{border:1px solid #647789;border-radius:17px;background:#192633;padding:17px;width:100%;max-width:350px;box-shadow:0 20px 40px #000a}.modal h3{font-size:18px;margin:0 0 8px}.modal p{color:#c5d1dc;line-height:1.4;font-size:13px;margin:0 0 16px}.modal-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal-buttons button{border-radius:10px;padding:11px 7px;border:1px solid #526b82;background:#263543;color:#dfe8f0;font-size:13px;font-weight:800}.modal-buttons button.confirm{background:var(--orange);border-color:var(--orange);color:#180c08}.empty-after{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;color:#c4d3df}.empty-after b{font-size:20px;color:var(--ink)}.empty-after p{font-size:12px;line-height:1.4;color:var(--muted);max-width:24ch;margin:0}.empty-after .icon-ring{height:49px;width:49px;display:grid;place-items:center;border:1px solid var(--teal);color:var(--teal);border-radius:50%;font-size:26px}.done-flash{color:var(--good);font-weight:800}.completed{display:flex;flex-direction:column;height:100%;align-items:center;justify-content:center;text-align:center;gap:10px}.completed .symbol{font-size:44px;color:var(--good)}.completed h2{font-size:23px;margin:0}.completed p{font-size:13px;color:var(--muted);line-height:1.5;max-width:29ch;margin:0}
@media (max-height:740px){:root{--space:10px}.app{padding-top:calc(env(safe-area-inset-top) + 5px);padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}.shell{border-radius:18px}.progress{margin:8px 0}.intro{margin-bottom:7px}.intro h1{font-size:19px}.step-sign{width:31px;height:31px}.scene-stage{padding:9px}.pilot{padding:8px}.pilot-grid{gap:6px}.nav{margin-top:6px}.nav button{min-height:40px}.privacy{margin-top:5px}.action-btn{min-height:35px;padding:7px}.lap-row{padding:6px 10px}.time-big{font-size:clamp(39px,13vw,54px)}}
@media (max-height:620px){.privacy{display:none}.intro p{font-size:11px}.intro h1{font-size:17px}.shell{padding:7px}.progress{margin:5px 0}.lap-row{padding:4px 8px}.scene-stage{padding:7px}.pilot-time{font-size:22px}.last-best{padding-top:5px}.central{gap:7px}.lap-chip{padding:3px 1px;font-size:10px}.lap-peek-title{font-size:9px;margin-bottom:3px}.pilot-grid{gap:5px}.actionline{gap:4px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* Contrôle Stop dans la case du pilote, comme en séance réelle. */
.pilot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:3px}
.pilot-top > div{min-width:0}
.pilot-stop{border:1px solid #ff986f;border-radius:8px;padding:6px 7px;min-width:52px;min-height:34px;background:#4b2b23;color:#ffe1d3;font-weight:850;font-size:11px;white-space:nowrap;touch-action:manipulation;flex-shrink:0;box-shadow:0 0 0 2px #ff6a3e20}
.pilot-stop:active{background:#a7472e;transform:scale(.96)}
.pilot.stop-target{border-color:#ff986f;box-shadow:inset 0 0 0 1px #ff6a3e77,0 0 0 2px #ff6a3e22}
.pilot-hint{font-size:10px;color:#ffb294;font-weight:800;line-height:1.15;margin-top:3px}
.pilot.stopped .pilot-hint{color:#b5dfb4}
@media(max-width:355px){.pilot-stop{min-width:43px;padding:5px 4px;font-size:10px}.pilot-name{font-size:12px}.pilot-hint{font-size:9px}}
.pilot.selected{outline:2px solid #ffac83;outline-offset:-3px;box-shadow:inset 0 0 0 2px #ffac8340}.pilot[role="button"]{cursor:pointer;-webkit-tap-highlight-color:transparent}.pilot[role="button"]:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<div class="app"><main class="shell" aria-label="Tutoriel KartLap interactif">
  <header class="header"><div><div class="brand">KARTLAP <span style="color:#7f93a4;font-weight:600">/ ACADÉMIE</span></div><div class="step-label" id="stepNum">Tour de chauffe • 01 / 08</div></div><button class="close" id="close" aria-label="Fermer le tutoriel" title="Quitter la démonstration">×</button></header>
  <div class="progress" id="progress" role="progressbar" aria-label="Progression du tutoriel" aria-valuemin="1" aria-valuemax="8" aria-valuenow="1"></div>
  <section class="intro"><span class="step-sign" id="sign" aria-hidden="true">⌁</span><div class="intro-copy"><h1 id="heading">Ta grille, déjà prête.</h1><p id="description">Quatre pilotes. Des tours réels de démonstration pour comprendre d'un coup d'œil.</p></div></section>
  <section class="scene" id="scene" aria-label="Zone interactive de démonstration"></section>
  <footer><div class="footnote" id="footnote" aria-live="polite">Aucune donnée réelle modifiée.</div><div class="nav"><button id="prev">← Retour</button><button class="next" id="next">Étape suivante →</button></div><p class="privacy">Mode démonstration · Aucun chrono réel interrompu</p></footer>
</main></div>
<script>
(() => {
  'use strict';
  const pilots=[
    {id:21,name:'Alex',shade:'teal',laps:[50.384,50.102,49.817]},
    {id:7,name:'Charlie',shade:'purple',laps:[50.221,49.978,49.472]},
    {id:42,name:'Sam',shade:'orange',laps:[51.409,50.981,50.602]},
    {id:9,name:'Max',shade:'',laps:[50.891,50.355,50.044]}
  ];
  let step=0,started=false,recorded=false,stopped=false,lapOpen=false,hideDialog=false,hidden=false,done=false,success='',timerStart=0,elapsed=0,raf=0,swipeDisableClick=false,pointer=null;
  const $=(s)=>document.querySelector(s);
  const descriptions=[
    ['▦','Quatre pilotes. Aucun doublon.','Alex, Charlie, Sam et Max sont déjà chargés. Touche une case pour la sélectionner, sans créer un nouveau pilote.'],
    ['▶','Un tap pour démarrer.','Touche Alex pour lancer son chrono. Ses 3 tours précédents restent visibles.'],
    ['⊕','Chaque passage ajoute un tour.','Touche encore Alex. Son nouveau tour apparaît immédiatement.'],
    ['★','Violet = meilleur de séance.','Un temps violet indique le meilleur tour parmi tous les pilotes.'],
    ['■','Arrêter Alex sur sa case.','Touche « ■ Stop » dans la case d’Alex. Elle prend la place en bas à gauche; les autres continuent.'],
    ['→','Un geste pour voir ses tours.','Glisse la case vers la droite. Refais le geste pour revenir au chrono.'],
    ['←','Cache la case, pas les tours.','Glisse Alex à gauche, puis confirme « Masquer ». Ses temps restent.'],
    ['≋','Ta séance, en un coup d’œil.','Compare les 4 pilotes et leurs meilleurs tours dans le résumé.']
  ];
  const fmt=v=>Number(v).toFixed(3);
  const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lapValues=()=>recorded?[...pilots[0].laps,49.621]:pilots[0].laps;
  const best=a=>Math.min(...a);
  const progress=()=>{const e=$('#progress');e.innerHTML=descriptions.map((_,i)=>`<span class="${i<step?'done':i===step?'current':''}"></span>`).join('');e.setAttribute('aria-valuenow',String(step+1));};
  const msg=(t,kind='ok')=>{success=t;const e=$('#footnote');e.innerHTML=`<span class="${kind}">${escapeHtml(t)}</span>`;};
  function tick(){if(!started||stopped)return;const secs=(performance.now()-timerStart)/1000;const time=$('#liveTime');if(time)time.textContent=fmt(secs);raf=requestAnimationFrame(tick);}
  function endTimer(){if(raf)cancelAnimationFrame(raf);raf=0;}
  function resetFor(s){endTimer();started=false;recorded=false;stopped=false;lapOpen=false;hideDialog=false;hidden=false;success='';elapsed=0;step=s;done=false;render();}
  function actionTap(){
    if(step===1){if(!started){started=true;timerStart=performance.now();tick();msg('✓ Le chrono d’Alex est parti.');render(false);}}
    else if(step===2){recorded=true;started=true;timerStart=performance.now();msg('✓ Tour 4 : 49.621 s — nouveau record personnel !');render(false);tick();}

  }
  function pilotCard(p){const b=best(p.laps),halt=step===4&&stopped&&p.id===21,focusStop=step===4&&p.id===21&&!stopped;
    return `<div class="pilot ${p.shade} ${halt?'stopped':''} ${focusStop?'stop-target':''}" data-pilot-id="${p.id}" ${step===0?'role="button" tabindex="0"':''} aria-label="${escapeHtml(p.name)} meilleur ${fmt(b)} secondes"><div><div class="pilot-top"><div><div class="pilot-name">#${p.id} · ${escapeHtml(p.name)}</div><div class="pilot-tag">${halt?'ARRÊTÉ · TOURS CONSERVÉS':p.laps.length+' TOURS ENREGISTRÉS'}</div></div>${focusStop?'<button type="button" class="pilot-stop" id="stopAlexInCard" aria-label="Arrêter Alex, directement dans sa case">■ Stop</button>':''}</div>${focusStop?'<div class="pilot-hint">↗ Appuie sur Stop</div>':halt?'<div class="pilot-hint">✓ Temps conservés</div>':''}</div><div><div class="pilot-time">${fmt(b)}</div><div class="pilot-summary">${halt?'■ CHRONO ARRÊTÉ':p.shade==='purple'?'★ RECORD SÉANCE':'Dernier '+fmt(p.laps[p.laps.length-1])}</div></div></div>`;}
  function gridView(){const order=step===4?(stopped?[pilots[1],pilots[2],pilots[0],pilots[3]]:[pilots[1],pilots[2],pilots[3],pilots[0]]):[pilots[1],pilots[2],pilots[3],pilots[0]];return `<div class="scene-stage"><div class="scene-section"><span class="demo-tag"><i></i> SIMULATION</span><span class="mini-meta">4 pilotes · 12 tours</span></div><div class="pilot-grid">${order.map(pilotCard).join('')}</div></div>`;}
  function frontCard(){const laps=lapValues(), b=best(laps), isInteractive=step===1||step===2||step===4;const live=started&&!stopped;return `<div class="demo-card" id="frontCard" ${isInteractive?'role="button" tabindex="0" aria-label="'+(step===4?'Arrêter le chrono Alex':'Toucher pour enregistrer un passage')+'"':'role="group" aria-label="Carte Alex"'}><div class="card-main"><div><div class="num-name">#21 · Alex</div><div class="status-pill">${stopped?'ARRÊTÉ':live?'EN COURS':'PRÊT'} · ${laps.length} TOURS</div></div><span class="demo-tag"><i></i> DÉMO</span></div>${step===5?'<span class="swipe-nudge">GLISSE →</span>':step===6?'<span class="swipe-nudge left">← GLISSE</span>':''}${step===1&&!started?'<span class="tap-hint">TOUCHE POUR DÉMARRER</span>':step===2&&!recorded?'<span class="tap-hint">TOUCHE = NOUVEAU TOUR</span>':step===4&&!stopped?'<span class="tap-hint">TOUCHE POUR ARRÊTER</span>':''}<div class="central"><div class="time-big" id="liveTime">${live?fmt(elapsed):step===1?'0.000':step===2&&!recorded?'49.817':step===2&&recorded?'0.000':'49.817'}</div><div class="lap-peek"><div class="lap-peek-title">TOURS DÉJÀ ENREGISTRÉS</div><div class="lap-chips">${laps.slice(-3).map((n,i)=>`<div class="lap-chip ${n===best(laps)?'pb':''}"><span>TOUR ${laps.length-2+i}</span>${fmt(n)}</div>`).join('')}</div></div></div><div><div class="lap-count">Historique conservé · ${laps.length} tours</div><div class="last-best"><div>DERNIER<strong>${fmt(laps[laps.length-1])}</strong></div><div>MEILLEUR<strong>${fmt(b)}</strong></div></div></div></div>`;}
  function lapSheet(){const laps=lapValues();return `<div class="lap-sheet"><div class="sheet-head"><b>#21 · Alex</b><span>${laps.length} TOURS</span></div>${laps.slice().reverse().map((v,idx)=>`<div class="lap-row ${v===best(laps)?'pb':''}"><span class="lap-icon">${v===best(laps)?'★':'○'} Tour ${laps.length-idx}</span><strong>${fmt(v)} s</strong></div>`).join('')}<div class="sheet-info">Les tours restent enregistrés même si la case est masquée.</div><button class="sheet-return" id="sheetReturn">← Retour au chrono</button></div>`;}
  function confirmHide(){return `<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirmHeading"><div class="modal"><h3 id="confirmHeading">Masquer Alex ?</h3><p>La case disparaît de la grille. Ses <strong>3 tours</strong> restent dans l’historique. Tu pourras le réafficher.</p><div class="modal-buttons"><button id="cancelHide">Annuler</button><button class="confirm" id="acceptHide">Masquer la case</button></div></div></div>`;}
  function cardScene(){if(step===6&&hidden)return `<div class="scene-stage"><span class="demo-tag"><i></i> SIMULATION</span><div class="empty-after"><div class="icon-ring">✓</div><b>Case masquée</b><p>Alex n’est plus sur la grille, mais ses trois tours sont conservés.</p><button class="action-btn" id="restore">↺ Réafficher Alex</button></div></div>`;
    return `<div class="scene-stage"><div class="scene-section"><span class="demo-tag"><i></i> SIMULATION</span><span class="mini-meta">#21 · Alex</span></div><div class="card-slot" id="cardSlot">${step===5?'<div class="reveal"><span class="go-left">◀ MASQUER</span><span class="go-right">TOURS ▶</span></div>':step===6?'<div class="reveal"><span class="go-left">MASQUER ◀</span><span class="go-right">TOURS ▶</span></div>':''}${step===5&&lapOpen?lapSheet():frontCard()}</div>${hideDialog?confirmHide():''}</div>`;
  }
  function summaryScene(){const sorted=pilots.map(p=>({...p,best:best(p.laps)})).sort((a,b)=>a.best-b.best);return `<div class="scene-stage"><div class="scene-section"><span class="demo-tag"><i></i> RÉSULTATS DÉMO</span><span class="mini-meta">12 tours</span></div><div class="result-panel"><div><div class="result-title">Classement de la séance</div><div class="result-sub">Classement par meilleur tour · s</div></div>${sorted.map((p,i)=>`<div class="rank-line ${i===0?'winner':''}"><span>${i+1}</span><span>${escapeHtml(p.name)}</span><strong>${fmt(p.best)}</strong><em>${i===0?'★ Purple Lap':p.laps.length+' tours'}</em></div>`).join('')}<div class="summary-foot">Données fictives · Piste Démo · Aucune donnée sauvegardée</div></div></div>`;}
  function completedScene(){return `<div class="scene-stage"><div class="completed"><div class="symbol">◎</div><h2>Prêt pour la piste.</h2><p>Tu sais démarrer, marquer un tour, arrêter, consulter et masquer les cases — sans perdre tes résultats.</p><button class="action-btn primary" id="redo">↺ Refaire le tour de chauffe</button></div></div>`;}
  function sceneAction(){if(done)return '';if(step===0)return '<button class="action-btn" id="openDemo">Démarrer le chrono d’Alex →</button>';if(step===3)return '<button class="action-btn" id="showPurple">★ Voir le record de Charlie</button>';if(step===5)return `<button class="action-btn" id="toggleLaps">${lapOpen?'← Revenir au chrono':'Voir les tours sans glisser →'}</button>`;if(step===6)return `<button class="action-btn" id="toggleHide">${hidden?'↺ Réafficher Alex':'Masquer sans glisser ←'}</button>`;if(step===7)return '<button class="action-btn" id="seeResult">★ Charlie a le meilleur tour : 49.472 s</button>';if(step===4)return '';if(step===2&&recorded)return '<button class="action-btn" id="resetLap">↺ Rejouer le passage</button>';return '';}
  function sceneHtml(){const middle=done?completedScene():[0,3,4].includes(step)?gridView():step===7?summaryScene():cardScene();return middle+`<div class="actionline">${sceneAction()}</div>`;}
  function render(replaceAll=true){
    if(replaceAll){if(done){$('#stepNum').textContent='Tour de chauffe · Terminé';$('#heading').textContent='Bien joué.';$('#description').textContent='Une interface, des gestes simples, tes tours toujours conservés.';$('#sign').textContent='✓';}else{const [sig,title,description]=descriptions[step];$('#stepNum').textContent=`Tour de chauffe · ${String(step+1).padStart(2,'0')} / 08`;$('#heading').textContent=title;$('#description').textContent=description;$('#sign').textContent=sig;}progress();}
    $('#scene').innerHTML=sceneHtml();$('#prev').disabled=(!done&&step===0);$('#next').textContent=done?'Fermer la démo':step===7?'Terminer la visite ✓':'Étape suivante →';if(!success)$('#footnote').textContent=step===0?'Touche un pilote pour le sélectionner. Aucun doublon possible.':step===4?'Le bouton Stop est dans la case du pilote · démonstration':'Essaie le geste ou utilise le bouton · données fictives'; else msg(success);
    // Étape 1 : une case existante sert uniquement à sélectionner son pilote.
    // Elle ne peut jamais créer ni dupliquer un pilote.
    if(step===0&&!done){
      document.querySelectorAll('#scene .pilot[data-pilot-id]').forEach(card=>{
        const select=()=>{
          document.querySelectorAll('#scene .pilot').forEach(p=>p.classList.remove('selected'));
          card.classList.add('selected');
          const pilot=pilots.find(p=>String(p.id)===card.dataset.pilotId);
          if(pilot)msg(`✓ ${pilot.name} sélectionné. Il est déjà dans la grille : aucun doublon créé.`);
        };
        card.addEventListener('click',select);
        card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select();}});
      });
    }
    $('#frontCard')?.addEventListener('click',e=>{if(swipeDisableClick){swipeDisableClick=false;return;}actionTap()});$('#frontCard')?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();actionTap()}});
    $('#toggleLaps')?.addEventListener('click',toggleLaps);$('#sheetReturn')?.addEventListener('click',toggleLaps);$('#toggleHide')?.addEventListener('click',()=>{if(hidden){hidden=false;msg('✓ Alex est de retour dans la grille.');render(false)}else askHide()});$('#restore')?.addEventListener('click',()=>{hidden=false;msg('✓ Alex réapparaît avec ses tours.');render(false)});
    $('#cancelHide')?.addEventListener('click',()=>{hideDialog=false;msg('Masquage annulé.','hint');render(false)});
    $('#acceptHide')?.addEventListener('click',()=>{hideDialog=false;hidden=true;msg('✓ Case masquée. Historique conservé.');render(false)});
    $('#openDemo')?.addEventListener('click',()=>resetFor(1));$('#showPurple')?.addEventListener('click',()=>msg('★ Charlie : 49.472 s — le meilleur des 4 pilotes.'));$('#seeResult')?.addEventListener('click',()=>msg('✓ Purple Lap : Charlie, 49.472 s.'));$('#stopAlexInCard')?.addEventListener('click',e=>{e.stopPropagation();stopped=true;msg('✓ Alex s’arrête et rejoint le bas à gauche. Ses tours restent.');render(false)});$('#resetLap')?.addEventListener('click',()=>resetFor(2));$('#redo')?.addEventListener('click',()=>resetFor(0));
    setupSwipe();
  }
  function toggleLaps(){lapOpen=!lapOpen;msg(lapOpen?'✓ Tous les tours d’Alex sont visibles.':'✓ Retour au chrono.');render(false)}
  function askHide(){if(hidden)return;hideDialog=true;msg('Les tours ne seront pas supprimés.','hint');render(false);$('#cancelHide')?.focus()}
  function swipe(dir){if(step===5){if(dir==='right'){toggleLaps()}else msg('Glisse vers la droite pour afficher les tours.','hint');}
    else if(step===6){if(dir==='left'){askHide()}else msg('Glisse vers la gauche pour masquer la case.','hint');}}
  function setupSwipe(){const target=$('#cardSlot');if(!target||![5,6].includes(step)||hideDialog||hidden)return;let start=null,delta=0,dy=0,card=null;
    target.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return; if(e.isPrimary===false)return; start={id:e.pointerId,x:e.clientX,y:e.clientY};delta=0;dy=0;card=target.querySelector('#frontCard');try{target.setPointerCapture(e.pointerId)}catch(_){} });
    target.addEventListener('pointermove',e=>{if(!start||e.pointerId!==start.id)return;delta=e.clientX-start.x;dy=e.clientY-start.y;if(Math.abs(delta)<8||Math.abs(delta)<=Math.abs(dy))return;if(card){card.classList.add('dragging');card.style.transform=`translateX(${Math.max(-80,Math.min(80,delta))}px)`;}});
    const end=e=>{if(!start||e.pointerId!==start.id)return;const d=delta,y=dy;start=null;if(card){card.style.transform='';card.classList.remove('dragging')}card=null;if(Math.abs(d)>=48&&Math.abs(d)>Math.abs(y)*1.2){swipeDisableClick=true;swipe(d>0?'right':'left');setTimeout(()=>{swipeDisableClick=false},350)}else if(Math.abs(d)>12){swipeDisableClick=true;setTimeout(()=>{swipeDisableClick=false},350)}};
    target.addEventListener('pointerup',end);target.addEventListener('pointercancel',()=>{start=null;if(card){card.style.transform='';card.classList.remove('dragging')}card=null});
    // iOS Safari: empêcher le geste du navigateur d'annuler le mouvement horizontal sur la carte.
    // touch-action: pan-y conserve le défilement vertical autorisé et désactive le pan horizontal natif.
  }
  $('#prev').addEventListener('click',()=>{if(done){resetFor(7);return;}if(step>0)resetFor(step-1)});
  $('#next').addEventListener('click',()=>{if(done){resetFor(0);return;}if(step<7)resetFor(step+1);else{endTimer();done=true;success='✓ Visite terminée. Aucun chrono réel modifié.';render(true)}});
  $('#close').addEventListener('click',()=>{endTimer();done=true;success='✓ Démonstration fermée, aucune donnée modifiée.';render(true)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&hideDialog){hideDialog=false;render(false)}else if(e.key==='ArrowRight'&&step===5&&document.activeElement?.id==='cardSlot'){swipe('right')}else if(e.key==='ArrowLeft'&&step===6&&document.activeElement?.id==='cardSlot'){swipe('left')}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){endTimer();if(started&&!stopped){elapsed=(performance.now()-timerStart)/1000;}}else if(started&&!stopped){timerStart=performance.now()-elapsed*1000;tick();}});
  render();
})();
</script>
</body>
</html>
